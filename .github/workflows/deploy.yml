name: Auto Deploy Evi Loan App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 1. Build the JAR file safely on GitHub's servers
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 2. Copy the generated JAR file directly to your VPS root folder
      - name: Copy JAR to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "target/loanApp-*.jar"
          target: "/home/admin/loanapp.co.ke/"
          strip_components: 1

      # 3. Process the file and cycle the systemd service
      - name: Restart Application Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            
            cd /home/admin/loanapp.co.ke/
            
            echo "Processing deployment artifacts..."
            
            # Find any newly uploaded snapshot JAR file
            NEW_JAR=$(ls loanApp-*.jar 2>/dev/null | head -n 1)
            
            if [ -n "$NEW_JAR" ]; then
                echo "Found newly uploaded artifact: $NEW_JAR"
                echo "Replacing production loanapp.jar..."
                # Force overwrite the running jar with the new one
                mv -f "$NEW_JAR" loanapp.jar
            elif [ -f "loanapp.jar" ]; then
                echo "No new version uploaded, but an existing loanapp.jar is present. Proceeding with restart..."
            else
                echo "Checking directory contents to diagnose missing file:"
                ls -la
                echo "ERROR: No deployable JAR file found!"
                exit 1
            fi
            
            # Double check cleaning up accidental target directories if scp misbehaved
            rm -rf target/
            
            # Ensure the service user group (www-data) can read the execution file
            chmod 640 loanapp.jar
            
            echo "Restarting loanapp.service..."
            sudo systemctl restart loanapp.service
            
            echo "Waiting for Liquibase migrations to initialize..."
            sleep 5
            
            sudo systemctl is-active loanapp.service
            echo "Deployment successful!"