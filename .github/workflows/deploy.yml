name: Auto Deploy Evi Loan App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 1. Build the JAR file safely on GitHub's servers
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 2. Copy only the generated JAR file to your VPS
      - name: Copy JAR to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "target/*.jar"
          target: "/home/admin/loanapp.co.ke/"
          strip_components: 1

      - name: Restart Application Service
        uses: appleboy/ssh-action@v1.0.3
        with:
            host: ${{ secrets.VPS_HOST }}
            username: ${{ secrets.VPS_USER }}
            key: ${{ secrets.VPS_SSH_KEY }}
            script: |
              set -e
              
              cd /home/admin/loanapp.co.ke/
              
              # 1. Take whatever jar was compiled, overwrite the static production loanapp.jar
              mv target/*.jar loanapp.jar
              
              # 2. Keep the directory clean by removing the build artifacts folder
              rm -rf target/
              
              # 3. Ensure the service user still owns the new file
              sudo chown www-data:www-data loanapp.jar
              
              echo "Restarting service..."
              sudo systemctl restart loanapp.service
              
              sleep 5
              sudo systemctl is-active loanapp.service