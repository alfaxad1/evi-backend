name: Auto Deploy Evi Loan App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 1. Build the JAR file safely on GitHub's servers
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 2. Copy only the generated JAR file to your VPS
      - name: Copy JAR to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "target/*.jar"
          target: "/home/admin/loanapp.co.ke/"
          strip_components: 1

      - name: Restart Application Service
        uses: appleboy/ssh-action@v1.0.3
        with:
            host: ${{ secrets.VPS_HOST }}
            username: ${{ secrets.VPS_USER }}
            key: ${{ secrets.VPS_SSH_KEY }}
            script: |
              set -e
              
              cd /home/admin/loanapp.co.ke/
              
              echo "Processing deployment artifacts..."
              
              # Smart check: If target folder exists and has a jar, move it. 
              # Otherwise, check if the jar is already in the root folder.
              if [ -d "target" ] && ls target/*.jar >/dev/null 2>&1; then
                  echo "Found JAR inside target/ folder. Moving to root..."
                  mv target/*.jar loanapp.jar
              elif ls *.jar >/dev/null 2>&1 && [ ! -f "loanapp.jar" ]; then
                  echo "Found JAR in root folder. Renaming to loanapp.jar..."
                  mv loanApp-*.jar loanapp.jar || mv *SNAPSHOT.jar loanapp.jar
              else
                  echo "Checking directory contents to see what went wrong:"
                  ls -la
                  ls -la target/ || true
                  echo "ERROR: No compiled JAR file found!"
                  exit 1
              fi
              
              # Clean up the target directory if it exists
              rm -rf target/
              
              # Ensure the service user group can read it
              chmod 640 loanapp.jar
              
              echo "Restarting service..."
              sudo systemctl restart loanapp.service
              
              sleep 5
              sudo systemctl is-active loanapp.service
              echo "Deployment successful!"